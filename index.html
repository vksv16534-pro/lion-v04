<!DOCTYPE html>
<!DOCTYPE html>
<html>
<head>
    <title>A1 SECURE LOGIN</title>
    <style>
        body { background: #000 url('https://w0.peakpx.com/wallpaper/424/16/HD-wallpaper-circuit-board-green-neon-lines-black-background-circuit-board-background-neon-circuit-board-abstraction-green-neon-background.jpg'); background-size: cover; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: sans-serif; }
        .box { background: rgba(0,0,0,0.9); padding: 40px; border: 2px solid #00ff41; border-radius: 15px; text-align: center; box-shadow: 0 0 20px #00ff41; }
        input { background: #111; border: 1px solid #00ff41; color: #00ff41; padding: 12px; width: 250px; margin: 10px; text-align: center; }
        button { background: #00ff41; color: #000; padding: 12px 40px; border: none; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="box">
        <h2 style="color:#00ff41;">A1 MASTER ACCESS</h2>
        <input type="password" id="pass" placeholder="ENTER MASTER KEY"> <br>
        <button onclick="auth()">ACCESS SYSTEM</button>
    </div>
    <script>
        function auth() {
            if(document.getElementById('pass').value === "9911") {
                window.location.href = "dashboard.html"; // यहाँ से अगले पेज पर जाएगा
            } else { alert("WRONG KEY!"); }
        }
    </script>
</body>
</html>
