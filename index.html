<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A1 COMMANDER CORE</title>
    <style>
        body { 
            background: #000 url('https://w0.peakpx.com/wallpaper/424/16/HD-wallpaper-circuit-board-green-neon-lines-black-background-circuit-board-background-neon-circuit-board-abstraction-green-neon-background.jpg') no-repeat center center fixed; 
            background-size: cover; margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #00ff41; display: flex; justify-content: center; align-items: center; min-height: 100vh;
        }
        .main-box { 
            background: rgba(0, 10, 20, 0.9); border: 2px solid #00ff41; border-radius: 15px; padding: 25px; box-shadow: 0 0 40px #00ff41; width: 90%; max-width: 400px; text-align: center; 
        }
        input { 
            background: #000; border: 1px solid #00ff41; color: #00ff41; padding: 15px; margin: 10px 0; width: 85%; border-radius: 8px; font-size: 16px; outline: none; box-shadow: inset 0 0 5px #00ff41;
        }
        .btn { 
            background: #00ff41; color: black; padding: 15px; border: none; width: 93%; border-radius: 8px; font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 16px; margin-top: 15px; transition: 0.3s;
        }
        .btn:hover { background: #00cc33; box-shadow: 0 0 20px #00ff41; }
        .recovery { color: #ff3333; font-size: 11px; margin-top: 15px; font-weight: bold; }
        .header-title { text-shadow: 0 0 15px #00ff41; letter-spacing: 2px; margin-bottom: 20px; }
    </style>
</head>
<body>

    <div class="main-box" id="loginGate">
        <h2 class="header-title">A1 ADMIN ACCESS</h2>
        <p style="font-size: 12px; color: #888;">SYSTEM STATUS: ENCRYPTED</p>
        
        <input type="text" placeholder="ADMIN ID" id="adminID">
        <input type="password" placeholder="ACCESS KEY" id="masterKey">
        
        <button class="btn" onclick="checkAccess()">AUTHORIZE ENTRY</button>
        
        <div class="recovery">FORGOT? OTP TO: Ak4041860@gmail.com</div>
    </div>

    <script>
        function checkAccess() {
            let id = document.getElementById('adminID').value;
            let key = document.getElementById('masterKey').value;

            // पासवर्ड 9911 ही है
            if(id === "admin" && key === "9911") {
                alert("ACCESS GRANTED! LOADING COMMAND CENTER...");
                // यहाँ आप अपना डैशबोर्ड वाला लिंक डाल सकते हैं
                window.location.href = "dashboard.html"; 
            } else {
                alert("ACCESS DENIED: INVALID CREDENTIALS");
            }
        }
    </script>

</body>
</html>
