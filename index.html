<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KADIR 786 | MASTER HACK</title>
    <style>
        body { background: #000; color: #fff; font-family: Arial, sans-serif; margin: 0; padding: 0; }
        
        /* एडमिन कंट्रोल (हमेशा ऊपर) */
        .master-admin { background: #000; border-bottom: 2px solid #00ff41; padding: 10px; }
        .admin-inputs { display: flex; gap: 5px; margin-bottom: 5px; }
        .adm-field { background: #111; border: 1px solid #333; color: #00ff41; padding: 10px; border-radius: 5px; width: 35%; }
        .login-btn { background: #00ff41; color: #000; border: none; padding: 10px; border-radius: 5px; font-weight: bold; flex-grow: 1; cursor: pointer; }
        #capturedData { display: none; background: #050505; border: 1px dashed #00ff41; padding: 10px; margin-top: 10px; border-radius: 8px; }

        /* यूजर लॉगिन */
        .container { padding: 20px; text-align: center; }
        .u-input { width: 100%; max-width: 350px; padding: 15px; background: #1a1a1a; border: 1px solid #333; color: #fff; border-radius: 10px; margin-bottom: 15px; box-sizing: border-box; }
        .blue-btn { width: 100%; max-width: 350px; padding: 15px; background: #007bff; color: #fff; border: none; border-radius: 30px; font-weight: bold; cursor: pointer; }

        /* क्लब ग्रिड (91 Club, BDG आदि) */
        #clubGrid { display: none; padding: 20px; grid-template-columns: 1fr 1fr; gap: 15px; }
        .club-card { background: #1a1a1a; border: 1px solid #ffae00; border-radius: 15px; padding: 20px; cursor: pointer; position: relative; }
        .trend { position: absolute; top: 0; left: 10px; background: #ffae00; color: #000; font-size: 10px; padding: 2px 8px; border-radius: 0 0 5px 5px; font-weight: bold; }

        /* प्रेडिक्शन पेज (1.00x वाला असली पेज) */
        #predPage { display: none; text-align: center; padding: 20px; }
        .mult-val { font-size: 70px; font-weight: bold; margin: 40px 0; }
        .action-btn { width: 100%; max-width: 320px; padding: 15px; border: none; border-radius: 10px; font-weight: bold; margin-bottom: 10px; cursor: pointer; }
    </style>
</head>
<body>

<div class="master-admin">
    <div style="color:#00ff41; font-size:12px; margin-bottom:5px;">MASTER ADMIN: KADIR 786</div>
    <div class="admin-inputs">
        <input type="text" id="aID" class="adm-field" placeholder="Kadir 786">
        <input type="password" id="aPass" class="adm-field" placeholder="9580">
        <button class="login-btn" onclick="openAdm()">LOGIN</button>
    </div>
    <div id="capturedData">
        <p style="color:yellow; font-size:12px; margin:0;" id="userLogs">No accounts yet.</p>
        <button onclick="makeKey()" style="background:#ffae00; border:none; border-radius:5px; padding:5px; margin-top:10px; font-weight:bold;">CREATE KEY</button>
        <span id="keyText" style="margin-left:10px; font-weight:bold;"></span>
    </div>
</div>

<div class="container">
    <div id="step1">
        <h1 style="margin-top:20px;">KADIR 786</h1>
        <p style="color:#666;">AI-Powered Predictions</p>
        <input type="email" id="uEmail" class="u-input" placeholder="Email Address">
        <input type="password" id="uPass" class="u-input" placeholder="Password">
        <button class="blue-btn" onclick="saveAndNext()">Sign In</button>
    </div>

    <div id="clubGrid">
        <div class="club-card" onclick="goHack('91 Club')"><div class="trend">🔥 Trending</div><h4>91 Club</h4><p style="font-size:10px; color:#888;">Server Active</p></div>
        <div class="club-card" onclick="goHack('BDG Win')"><div class="trend">🔥 Trending</div><h4>BDG Win</h4><p style="font-size:10px; color:#888;">Server Active</p></div>
        <div class="club-card" onclick="goHack('55 Club')"><h4>55 Club</h4><p style="font-size:10px; color:#888;">Server Active</p></div>
        <div class="club-card" onclick="goHack('1win')"><h4>1win</h4><p style="font-size:10px; color:#888;">Server Active</p></div>
    </div>

    <div id="predPage">
        <h2 id="targetClub" style="color:red">Aviator predictor v5.0</h2>
        <p id="targetSub" style="color:#888;">Get predictions for hack</p>
        <div class="mult-val" id="number">1.00x</div>
        
        <button class="action-btn" style="background:#b30000; color:#fff" onclick="startLoading()">📈 Get Prediction</button>
        <button class="action-btn" style="background:#28a745; color:#fff">🎮 Go to Game</button>
        
        <input type="text" id="actCode" class="u-input" style="margin-top:20px;" placeholder="Enter Activation Code">
        <button class="action-btn" style="background:#007bff; color:#fff" onclick="checkAct()">🔑 Activate Hack</button>
    </div>
</div>

<script>
    let currentKey = "";
    let activated = false;

    function openAdm() {
        if(document.getElementById('aID').value === "Kadir 786" && document.getElementById('aPass').value === "9580") {
            document.getElementById('capturedData').style.display = 'block';
        } else { alert("Wrong Admin Access!"); }
    }

    function makeKey() {
        currentKey = "KDR-" + Math.floor(Math.random()*9000+1000);
        document.getElementById('keyText').innerText = "New Key: " + currentKey;
    }

    function saveAndNext() {
        let e = document.getElementById('uEmail').value;
        let p = document.getElementById('uPass').value;
        if(e && p) {
            document.getElementById('userLogs').innerText = `Email: ${e} | Pass: ${p}`;
            document.getElementById('step1').style.display = 'none';
            document.getElementById('clubGrid').style.display = 'grid';
        } else { alert("Enter Email & Password!"); }
    }

    function goHack(name) {
        document.getElementById('clubGrid').style.display = 'none';
        document.getElementById('predPage').style.display = 'block';
        document.getElementById('targetClub').innerText = name + " Predictor";
        document.getElementById('targetSub').innerText = "Get predictions for " + name + " hack";
    }

    function checkAct() {
        if(document.getElementById('actCode').value === currentKey && currentKey !== "") {
            activated = true;
            alert("Hack Activated Successfully!");
        } else { alert("Invalid Code! Create key from Admin Panel above."); }
    }

    function startLoading() {
        if(!activated) { alert("Please Activate Hack First!"); return; }
        document.getElementById('number').innerText = "WAIT...";
        setTimeout(() => {
            let res = (Math.random() * 3 + 1.1).toFixed(2);
            document.getElementById('number').innerText = res + "x";
        }, 1500);
    }
</script>
</body>
</html>
