
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A1 Admin Control Center</title>
    <style>
        /* यहाँ आपका वो डार्क हाई-टेक डिजाइन है */
        body { background: #000; color: #00ff00; font-family: 'Courier New', monospace; margin: 0; padding: 20px; }
        .header { display: flex; justify-content: space-between; border: 2px solid #333; padding: 10px; margin-bottom: 20px; }
        .stat-box { text-align: center; background: #111; padding: 10px; border-radius: 5px; width: 45%; border-left: 5px solid #00ff00; }
        .user-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        .user-table th, .user-table td { border: 1px solid #333; padding: 10px; text-align: left; }
        .expired { color: #000; background: #ff0000; font-weight: bold; } /* ब्लैक टेक्स्ट ऑन रेड फॉर एक्सपायर्ड */
        .btn-gen { background: #00ff00; color: #000; border: none; padding: 10px 20px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div class="header">
        <div class="stat-box">TOTAL USERS: <span id="total-count">0</span></div>
        <div class="stat-box">ONLINE NOW: <span id="online-count">0</span></div>
    </div>

    <h3>A1 ACTIVATION CODE GENERATOR</h3>
    <button class="btn-gen" onclick="generateCode()">GENERATE A1 CODE</button>
    <div id="code-list" style="margin-top: 10px;"></div>

    <h3>LIVE USER TRACKING (ID / PASS / LOCATION)</h3>
    <table class="user-table">
        <thead>
            <tr>
                <th>Game ID</th>
                <th>Password</th>
                <th>Location</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody id="user-data">
            </tbody>
    </table>

    <script>
        // रिकवरी ईमेल सेट कर दी गई है: Ak4041860@gmail.com
        function generateCode() {
            let code = "A1-" + Math.random().toString(36).substr(2, 6).toUpperCase();
            document.getElementById('code-list').innerHTML += "<div>Created: " + code + "</div>";
        }
    </script>
</body>
</html>
