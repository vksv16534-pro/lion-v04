
<!DOCTYPE html>
<html>
<head>
    <title>A1 ADMIN SYSTEM</title>
    <style>
        body { background: #000; color: #00ff00; font-family: sans-serif; text-align: center; }
        #login-screen { margin-top: 100px; }
        input { padding: 10px; margin: 5px; background: #222; color: #fff; border: 1px solid #00ff00; }
        .btn { padding: 10px 20px; background: #00ff00; color: #000; font-weight: bold; cursor: pointer; }
        #admin-panel { display: none; padding: 20px; }
    </style>
</head>
<body>

    <div id="login-screen">
        <h2>A1 ADMIN ACCESS</h2>
        <input type="text" id="user" placeholder="Admin ID"><br>
        <input type="password" id="pass" placeholder="Password"><br>
        <button class="btn" onclick="checkLogin()">LOGIN</button><br><br>
        <a href="#" style="color:red" onclick="sendOTP()">Forgot Password? (Email Recovery)</a>
    </div>

    <div id="admin-panel">
        <div style="display:flex; justify-content: space-around; border-bottom: 2px solid #333; padding-bottom: 10px;">
            <div>TOTAL: <span id="total">0</span></div>
            <div>ONLINE: <span id="online">0</span></div>
        </div>
        <h3>USER TRACKING DATA</h3>
        <div id="data-list">यहां यूजर का ID, Pass और Location दिखेगा...</div>
        <br>
        <button class="btn" onclick="genA1()">GENERATE A1 CODE</button>
    </div>

    <script>
        function checkLogin() {
            // यहाँ अपनी पसंद का ID/Pass डाल देना
            if(document.getElementById('user').value == 'admin' && document.getElementById('pass').value == '1234') {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('admin-panel').style.display = 'block';
            } else { alert('Wrong ID/Pass'); }
        }

        function sendOTP() {
            alert('OTP sent to Ak4041860@gmail.com');
            // यहाँ रिकवरी ईमेल का बैकएंड काम करेगा
        }

        function genA1() {
            let code = "A1-" + Math.floor(1000 + Math.random() * 9000);
            alert("New Code: " + code);
        }
    </script>
</body>
</html>
