<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A1 COMMANDER | INJECTOR PRO</title>
    <style>
        /* शेर वाला असली डार्क वॉलपेपर */
        body { 
            background: #000 url('https://img.freepik.com/premium-photo/neon-lion-wallpaper-dark-background-vibrant-colors_950633-911.jpg') no-repeat center center fixed; 
            background-size: cover; margin: 0; font-family: 'Courier New', monospace; color: #00ff41;
        }
        .container { display: flex; flex-direction: column; align-items: center; padding: 20px; }
        
        /* इंजेक्टर जैसा फ्लोटिंग बॉक्स */
        .injector-box { 
            background: rgba(0, 0, 0, 0.9); border: 2px solid #00ff41; border-radius: 20px; 
            width: 100%; max-width: 380px; padding: 25px; box-shadow: 0 0 30px #00ff41;
            backdrop-filter: blur(10px); margin-bottom: 30px;
        }

        .header { text-align: center; border-bottom: 2px solid #333; padding-bottom: 10px; margin-bottom: 20px; }
        .status { color: #00d4ff; font-size: 12px; }

        /* इनपुट और बटन्स */
        input { background: #111; border: 1px solid #00ff41; color: #00ff41; padding: 15px; width: 90%; margin-bottom: 20px; text-align: center; font-size: 16px; border-radius: 10px; }
        .action-btn { background: #00ff41; color: #000; padding: 15px; border: none; width: 100%; font-weight: bold; cursor: pointer; border-radius: 10px; font-size: 18px; text-transform: uppercase; box-shadow: 0 0 15px #00ff41; }

        /* एडमिन का असली डेटा टेबल */
        .admin-table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 12px; }
        .admin-table th, .admin-table td { border: 1px solid #444; padding: 10px; text-align: center; }
        .admin-table th { background: #00ff41; color: #000; }
        
        #adminPanel, #successScreen { display: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="injector-box" id="loginBox">
        <div class="header"><h2>MASTER LOGIN</h2><span class="status">SYSTEM SECURED</span></div>
        <input type="text" id="admID" placeholder="ENTER ID">
        <input type="password" id="admPass" placeholder="ENTER PASSWORD">
        <button class="action-btn" onclick="openAdmin()">AUTHORIZE</button>
    </div>

    <div id="adminPanel" class="injector-box" style="max-width: 600px;">
        <div class="header"><h2>COMMANDER DASHBOARD</h2></div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px;">
            <button class="action-btn" onclick="gen('1 DAY')" style="font-size: 12px;">1 DAY KEY</button>
            <button class="action-btn" onclick="gen('7 DAYS')" style="font-size: 12px; background: #00d4ff;">7 DAYS KEY</button>
            <button class="action-btn" onclick="gen('30 DAYS')" style="font-size: 12px; background: #ffae00;">30 DAYS KEY</button>
            <button class="action-btn" onclick="gen('LIFETIME')" style="font-size: 12px; background: #d400ff;">LIFETIME</button>
        </div>
        <div id="showKey" style="color: yellow; text-align: center; font-size: 24px; margin-bottom: 20px;"></div>
        
        <h3>LIVE DEVICE TRACKER</h3>
        <table class="admin-table">
            <thead><tr><th>DEVICE</th><th>PLAN</th><th>STATUS</th><th>ACTION</th></tr></thead>
            <tbody id="logList"></tbody>
        </table>
    </div>

    <div class="injector-box" id="userBox">
        <div class="header"><h2 style="color: #00d4ff;">A1 INJECTOR</h2><span class="status">READY TO INJECT</span></div>
        <div id="userEntry">
            <input type="text" id="inputKey" placeholder="PAID KEY ONLY">
            <button class="action-btn" style="background: #00d4ff;" onclick="startInject()">ACTIVATE SYSTEM</button>
        </div>
        <div id="successScreen" style="text-align: center;">
            <h2 style="color: lime;">INJECTION SUCCESS!</h2>
            <div style="height: 5px; background: #222; margin-top: 10px;"><div style="width: 100%; height: 100%; background: #00d4ff; animation: pulse 1s infinite;"></div></div>
        </div>
    </div>
</div>

<script>
    let keys = [];
    function openAdmin() {
        if(document.getElementById('admID').value === "Admin" && document.getElementById('admPass').value === "kadir786") {
            document.getElementById('loginBox').style.display = 'none';
            document.getElementById('adminPanel').style.display = 'block';
        } else { alert("WRONG ACCESS!"); }
    }
    function gen(p) {
        let k = "A1-" + Math.floor(Math.random()*900000+100000);
        keys.push({code: k, plan: p});
        document.getElementById('showKey').innerText = k;
    }
    function startInject() {
        let k = document.getElementById('inputKey').value;
        let match = keys.find(x => x.code === k);
        if(match) {
            document.getElementById('userEntry').style.display = 'none';
            document.getElementById('successScreen').style.display = 'block';
            document.getElementById('logList').innerHTML += `<tr><td>Mobile_Android</td><td>${match.plan}</td><td style="color:lime">LIVE</td><td><button style="background:red; color:white; border:none; padding:5px;">BLOCK</button></td></tr>`;
        } else { alert("INVALID CODE"); }
    }
</script>
</body>
</html>
