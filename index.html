
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>A1 SECURE CORE - ENCRYPTED</title>
    <style>
        /* एकदम डार्क और हैकर थीम */
        body { background: #000; color: #00ff41; font-family: 'Courier New', monospace; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        #security-gate { border: 2px solid #00ff41; padding: 40px; text-align: center; box-shadow: 0 0 100px #00ff41; background: rgba(0,10,0,0.95); border-radius: 10px; }
        input { background: #000; border: 1px solid #00ff41; color: #00ff41; padding: 15px; margin: 15px 0; width: 280px; font-size: 20px; text-align: center; outline: none; }
        .unlock-btn { background: #00ff41; color: #000; padding: 15px 50px; border: none; font-weight: bold; cursor: pointer; letter-spacing: 2px; }
        #main-system { display: none; width: 100%; height: 100vh; padding: 20px; background: #000510; }
        .warning { color: red; font-size: 12px; margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body>

    <div id="security-gate">
        <h1 style="margin-bottom: 5px;">A1 COMMANDER</h1>
        <p style="font-size: 12px; color: #888;">ENCRYPTION: AES-256 BIT</p>
        <hr border="1" color="#00ff41">
        
        <div id="login-fields">
            <input type="password" id="masterKey" placeholder="ENTER ACCESS KEY">
            <br>
            <button class="unlock-btn" onclick="verifyAccess()">AUTHORIZE</button>
        </div>
        
        <p class="warning" id="error-msg"></p>
        <p style="font-size: 10px; color: #444;">Access attempts are being logged (IP Tracked)</p>
    </div>

    <div id="main-system">
        <h2 style="border-bottom: 2px solid #00d4ff;">SYSTEM LIVE: WELCOME AK4041860</h2>
        <p>Current Status: <span style="color:lime">PROTECTED</span></p>
        <button onclick="location.reload()" style="background:red; color:white;">EMERGENCY LOCK</button>
    </div>

    <script>
        let attempts = 0;

        function verifyAccess() {
            let key = document.getElementById('masterKey').value;
            let error = document.getElementById('error-msg');

            // पासवर्ड: 9911 (आप इसे कभी भी बदल सकते हैं)
            if (key === "9911") {
                document.getElementById('security-gate').style.display = 'none';
                document.getElementById('main-system').style.display = 'block';
                console.log("Access Granted to Administrator");
            } else {
                attempts++;
                error.innerText = "INVALID KEY. ATTEMPT " + attempts + " OF 3";
                
                if (attempts >= 3) {
                    document.getElementById('login-fields').innerHTML = "<h2 style='color:red'>SYSTEM TERMINATED</h2><p>Too many attempts. Your IP has been flagged.</p>";
                    // यहाँ हम असली ब्लॉक लॉजिक डाल सकते हैं
                }
            }
        }
    </script>
</body>
</html>
