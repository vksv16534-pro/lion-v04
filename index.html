<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>A1 COMMANDER CORE</title>
    <style>
        body { background: #000; color: #00ff41; font-family: 'Courier New', monospace; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow-x: hidden; }
        /* लॉगिन हिस्सा */
        #login-gate { text-align: center; border: 2px solid #00ff41; padding: 40px; border-radius: 15px; box-shadow: 0 0 20px #00ff41; background: rgba(0,10,0,0.9); }
        /* एडमिन हिस्सा (शुरू में छुपा हुआ) */
        #admin-panel { display: none; width: 95%; padding: 20px; background: #000510; min-height: 90vh; border: 1px solid #00d4ff; box-shadow: 0 0 30px #00d4ff; border-radius: 10px; }
        input { background: #111; border: 1px solid #00ff41; color: #00ff41; padding: 12px; margin: 10px; width: 250px; text-align: center; }
        .btn { background: #00ff41; color: #000; padding: 12px 30px; border: none; font-weight: bold; cursor: pointer; width: 100%; }
        .gen-btn { background: #00d4ff; color: #000; padding: 10px; margin: 5px; border: none; cursor: pointer; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; color: #00d4ff; font-size: 12px; }
        th, td { border: 1px solid #113355; padding: 10px; text-align: left; }
    </style>
</head>
<body>

    <div id="login-gate">
        <h2 style="text-shadow: 0 0 10px #00ff41;">A1 MASTER ACCESS</h2>
        <input type="password" id="mKey" placeholder="ENTER ACCESS KEY"> <br>
        <button class="btn" onclick="openSys()">AUTHORIZE</button>
        <p style="color:red; font-size: 10px; margin-top: 20px;">Ak4041860@gmail.com</p>
    </div>

    <div id="admin-panel">
        <div style="display:flex; justify-content: space-between; border-bottom: 2px solid #00d4ff; padding-bottom: 10px;">
            <h2 style="margin:0;">SYSTEM LIVE: AK4041860</h2>
            <button onclick="location.reload()" style="background:red; color:white; border:none; padding:5px 10px;">LOGOUT</button>
        </div>
        
        <div style="margin-top:20px; padding:15px; border:1px solid #444;">
            <h3>GENERATE CODES</h3>
            <button class="gen-btn" onclick="g('1 DAY')">1 DAY</button>
            <button class="gen-btn" style="background:magenta" onclick="g('7 DAYS')">7 DAYS</button>
            <button class="gen-btn" style="background:orange" onclick="g('30 DAYS')">30 DAYS</button>
            <div id="res" style="color:yellow; font-size: 20px; margin-top:10px;"></div>
        </div>

        <div style="margin-top:20px;">
            <h3>USER TRACKING LOGS</h3>
            <table>
                <tr><th>USER ID</th><th>PLAN</th><th>STATUS</th></tr>
                <tbody id="logs">
                    <tr><td>user_test_88</td><td>30 Days</td><td style="color:lime">ACTIVE</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        function openSys() {
            if(document.getElementById('mKey').value === "9911") {
                document.getElementById('login-gate').style.display = 'none';
                document.getElementById('admin-panel').style.display = 'block';
            } else { alert("WRONG KEY!"); }
        }
        function g(p) {
            let c = "A1-" + Math.floor(Math.random()*900000+100000);
            document.getElementById('res').innerText = "GENERATED: " + c + " ("+p+")";
        }
    </script>
</body>
</html>
