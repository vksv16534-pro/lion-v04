        /* --- 1. ADMIN PANEL (TOP) --- */
        .admin-box { background: #111; border-bottom: 2px solid #00ff41; padding: 15px; }
        .adm-row { display: flex; gap: 5px; margin-bottom: 10px; }
        .adm-in { background: #000; border: 1px solid #333; color: #00ff41; padding: 10px; width: 40%; border-radius: 5px; }
        #adminTools { display: none; margin-top: 10px; border-top: 1px solid #222; padding-top: 10px; }
        
        /* --- 2. USER INTERFACE (BOTTOM) --- */
        .user-container { padding: 20px; text-align: center; }
        .logo-img { width: 60px; margin-top: 10px; }
        .u-in { width: 100%; max-width: 350px; padding: 15px; background: #1a1a1a; border: 1px solid #333; color: #fff; border-radius: 10px; margin-bottom: 15px; box-sizing: border-box; }
        .blue-btn { width: 100%; max-width: 350px; padding: 15px; background: #007bff; color: #fff; border: none; border-radius: 30px; font-weight: bold; cursor: pointer; }

        /* Club Grid with Wallpapers */
        #clubGrid { display: none; padding: 20px; grid-template-columns: 1fr 1fr; gap: 15px; }
        .club-card { 
            background: #1a1a1a; border: 1px solid #ffae00; border-radius: 15px; padding: 15px; 
            text-align: center; cursor: pointer; position: relative; 
            background-size: cover; background-position: center; min-height: 100px;
        }
        .club-card h4 { margin: 5px 0; background: rgba(0,0,0,0.7); display: inline-block; padding: 2px 5px; }
        .trend { position: absolute; top: 0; left: 10px; background: #ffae00; color: #000; font-size: 10px; padding: 2px 8px; border-radius: 0 0 5px 5px; font-weight: bold; }

        /* Prediction System */
        #predPage { display: none; text-align: center; padding: 20px; }
        .mult { font-size: 70px; font-weight: bold; margin: 40px 0; color: #fff; text-shadow: 0 0 15px red; }
    </style>
</head>
