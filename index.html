
   <!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A1 COMMANDER PRO</title>
    <style>
        :root { --neon: #00ff41; --cyan: #00d4ff; --bg: rgba(0, 0, 0, 0.9); }
        body { 
            background: #000 url('https://img.freepik.com/premium-photo/neon-lion-wallpaper-dark-background-vibrant-colors_950633-911.jpg') no-repeat center center fixed; 
            background-size: cover; margin: 0; font-family: 'Segoe UI', sans-serif; color: var(--neon);
        }
        .container { display: flex; flex-direction: column; align-items: center; padding: 20px; gap: 20px; }
        
        /* असली हाई-टेक बॉक्स */
        .glass-panel { 
            background: var(--bg); border: 1px solid var(--neon); border-radius: 10px; width: 100%; max-width: 450px; 
            padding: 15px; box-shadow: 0 0 15px rgba(0,255,65,0.3); position: relative; overflow: hidden;
        }
        .glass-panel::before { content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 2px; background: linear-gradient(90deg, transparent, var(--neon), transparent); animation: scan 3s linear infinite; }
        @keyframes scan { 0% { left: -100%; } 100% { left: 100%; } }

        .header-title { font-size: 14px; letter-spacing: 2px; text-transform: uppercase; border-bottom: 1px solid #333; padding-bottom: 8px; margin-bottom: 15px; display: flex; justify-content: space-between; }
        .status-dot { height: 8px; width: 8px; background: lime; border-radius: 50%; display: inline-block; box-shadow: 0 0 5px lime; }

        input { background: #080808; border: 1px solid #333; color: var(--neon); padding: 12px; width: 92%; margin-bottom: 10px; outline: none; transition: 0.3s; }
        input:focus { border-color: var(--cyan); box-shadow: 0 0 10px rgba(0,212,255,0.2); }

        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
        .main-btn { background: var(--neon); color: #000; border: none; padding: 12px; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        .main-btn:active { transform: scale(0.98); }
        
        .user-card { background: #111; border: 1px solid #222; padding: 10px; margin-top: 10px; font-size: 12px; display: flex; justify-content: space-between; align-items: center; }
        .badge { background: #333; padding: 2px 6px; border-radius: 4px; font-size: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div class="glass-panel" id="adminBox">
        <div class="header-title">
            <span>A1 ADMIN PANEL v4.0</span>
            <span><span class="status-dot"></span> LIVE</span>
        </div>
        
        <div id="adminLogin">
            <input type="text" id="aID" placeholder="ADMIN ID">
            <input type="password" id="aPass" placeholder="PASSWORD">
            <button class="main-btn" style="width:100%" onclick="authA()">LOGIN TO SYSTEM</button>
        </div>

        <div id="adminDash" style="display:none;">
            <div style="display: flex; justify-content: space-around; margin-bottom: 15px; background: #0a0a0a; padding: 10px;">
                <div style="text-align:center"><small>USERS</small><br><b id="uCount">0</b></div>
                <div style="text-align:center"><small>KEYS</small><br><b id="kCount">0</b></div>
                <div style="text-align:center; color: var(--cyan);"><small>SERVER</small><br><b>STABLE</b></div>
            </div>

            <p style="font-size: 12px; margin-bottom: 5px;">GENERATE ACTIVATION KEY:</p>
            <div class="btn-grid">
                <button class="main-btn" onclick="genK('1 DAY')">1 DAY</button>
                <button class="main-btn" onclick="genK('7 DAYS')" style="background:var(--cyan)">7 DAYS</button>
                <button class="main-btn" onclick="genK('30 DAYS')" style="background:#ffae00">30 DAYS</button>
                <button class="main-btn" onclick="genK('LIFETIME')" style="background:#d400ff">LIFETIME</button>
            </div>
            <div id="newKey" style="margin: 15px 0; font-size: 22px; color: yellow; text-align: center; border: 1px dashed yellow; padding: 10px; display: none;"></div>

            <p style="font-size: 12px; margin-top: 20px;">ACTIVE DEVICES LOG:</p>
            <div id="userLogs">
                </div>
        </div>
    </div>

    <div class="glass-panel" style="border-color: var(--cyan);">
        <div class="header-title" style="color: var(--cyan);">
            <span>USER INJECTOR PORTAL</span>
            <span style="color: #666;">v1.2</span>
        </div>
        <div id="userForm">
            <input type="text" id="uName" placeholder="DEVICE OWNER NAME">
            <input type="text" id="uKey" placeholder="PAID KEY CODE">
            <button class="main-btn" style="background: var(--cyan); width: 100%;" onclick="authU()">ACTIVATE INJECTOR</button>
        </div>
        <div id="userActive" style="display:none; text-align:center; padding: 20px;">
            <div style="color: lime; font-size: 20px;">INJECTION SUCCESS!</div>
            <p id="uMsg" style="color: #ccc; font-size: 14px;"></p>
            <div style="width: 100%; background: #222; height: 5px; margin-top: 10px;">
                <div style="width: 100%; height: 100%; background: var(--cyan); box-shadow: 0 0 10px var(--cyan);"></div>
            </div>
        </div>
    </div>
</div>

<script>
    let db = { keys: [], users: [] };

    function authA() {
        if(document.getElementById('aID').value === "Admin" && document.getElementById('aPass').value === "kadir786") {
            document.getElementById('adminLogin').style.display='none';
            document.getElementById('adminDash').style.display='block';
        } else { alert("ACCESS DENIED"); }
    }

    function genK(plan) {
        let k = "A1-" + Math.floor(Math.random() * 900000 + 100000);
        db.keys.push({code: k, plan: plan});
        let el = document.getElementById('newKey');
        el.innerText = k;
        el.style.display = 'block';
        document.getElementById('kCount').innerText = db.keys.length;
    }

    function authU() {
        let name = document.getElementById('uName').value;
        let key = document.getElementById('uKey').value;
        let match = db.keys.find(x => x.code === key);

        if(match) {
            document.getElementById('userForm').style.display='none';
            document.getElementById('userActive').style.display='block';
            document.getElementById('uMsg').innerText = "Welcome " + name + " | Plan: " + match.plan;
            
            // Log to Admin
            db.users.push(name);
            document.getElementById('uCount').innerText = db.users.length;
            let log = `<div class="user-card">
                <span><b>${name}</b> <br><small style="color:#666">Device: Mobile_Android</small></span>
                <span class="badge" style="color:lime">${match.plan}</span>
                <button onclick="this.parentElement.remove()" style="background:red; border:none; color:white; font-size:8px; padding:4px;">BLOCK</button>
            </div>`;
            document.getElementById('userLogs').innerHTML += log;
        } else { alert("INVALID OR EXPIRED KEY"); }
    }
</script>

</body>
</html>
