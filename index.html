
<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>MASTER ADMIN CONTROL - A1 SYSTEM</title>
    <style>
        body { background: #050505; color: #00ff41; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; margin: 0; }
        .box { border: 2px solid #00ff41; padding: 20px; margin: 50px auto; width: 300px; box-shadow: 0 0 20px #00ff41; }
        input { width: 80%; padding: 10px; margin: 10px 0; background: #111; border: 1px solid #00ff41; color: white; }
        .btn { background: #00ff41; color: black; padding: 10px 20px; border: none; cursor: pointer; font-weight: bold; width: 100%; }
        #dashboard { display: none; padding: 20px; }
        .stat-container { display: flex; justify-content: space-around; margin-bottom: 30px; }
        .stat-card { background: #111; border: 1px solid #00ff41; padding: 15px; width: 40%; border-radius: 10px; }
        table { width: 100%; margin-top: 20px; border-collapse: collapse; }
        th, td { border: 1px solid #333; padding: 12px; text-align: left; }
    </style>
</head>
<body>

    <div id="login-box" class="box">
        <h2>A1 ADMIN LOGIN</h2>
        <input type="text" id="adminId" placeholder="एडमिन आईडी">
        <input type="password" id="adminPass" placeholder="पासवर्ड">
        <button class="btn" onclick="login()">प्रवेश करें</button>
        <p style="font-size: 12px; color: red; cursor: pointer;" onclick="forgot()">Forgot Password? (OTP to Ak4041860@gmail.com)</p>
    </div>

    <div id="dashboard">
        <h1>A1 CONTROL PANEL</h1>
        <div class="stat-container">
            <div class="stat-card"><h3>TOTAL USERS</h3><h2 id="total">0</h2></div>
            <div class="stat-card"><h3>ONLINE NOW</h3><h2 id="online" style="color: #ff0000;">● 0</h2></div>
        </div>

        <button class="btn" style="width: 250px;" onclick="generateA1()">GENERATE A1 CODE</button>
        <div id="codeDisplay" style="margin-top: 10px; font-weight: bold;"></div>

        <h3>LIVE USER DATA (ID / PASS / LOCATION)</h3>
        <table>
            <thead>
                <tr>
                    <th>Game ID</th>
                    <th>Password</th>
                    <th>Live Location</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="userTable">
                </tbody>
        </table>
    </div>

    <script>
        // आपका सीक्रेट आईडी पासवर्ड
        function login() {
            let id = document.getElementById('adminId').value;
            let pass = document.getElementById('adminPass').value;
            if(id === "admin" && pass === "9911") { // पासवर्ड 9911 रखा है
                document.getElementById('login-box').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
            } else { alert("गलत एक्सेस!"); }
        }

        function generateA1() {
            let code = "A1-" + Math.floor(Math.random() * 900000 + 100000);
            document.getElementById('codeDisplay').innerHTML = "NEW CODE: " + code;
        }

        function forgot() {
            alert("ओटीपी Ak4041860@gmail.com पर भेज दिया गया है।");
        }
    </script>
</body>
</html>
